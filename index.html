<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسار — منصة التعلّم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
    --ink: #15110c; --ink-2: #1c1710; --ink-3: #241d14;
    --line: #382e20; --paper: #f1e7d3;
    --muted: #9c9182; --muted-2: #6f6656;
    --brass: #d3a24f; --teal: #5f9284;
    --fire1: #f4a340; --fire2: #e8642e; --fire3: #c73a1f;
    --bg: var(--ink); --surface: var(--ink-2); --surface2: var(--ink-3);
    --brand: var(--brass); --brand-soft: rgba(211,162,79,.12);
    --ok-bg: rgba(95,146,132,.15); --ok-fg: #8fc3b3;
    --warn-bg: rgba(211,162,79,.15); --warn-fg: var(--brass);
    --bad-bg: rgba(200,80,80,.15); --bad-fg: #e08585;
    --shadow: 0 14px 34px -18px rgba(0,0,0,.7);
    --font: 'IBM Plex Sans Arabic', sans-serif;
    --display: 'Amiri', serif;
    --mono: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--ink); color: var(--paper); font-family: var(--font); line-height: 1.9; min-height: 100vh; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.35; font-weight: 700; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 6px; }

/* ============ BUTTONS ============ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 2px; padding: 11px 22px; font-weight: 600; font-size: 14px; background: var(--brass); color: var(--ink); transition: all .25s ease; letter-spacing: .3px; white-space: nowrap; font-family: var(--font); }
.btn:hover { background: #e3b562; box-shadow: 0 8px 22px -10px rgba(211,162,79,.6); transform: translateY(-1px); }
.btn.soft { background: transparent; color: var(--brass); border-color: var(--brass); }
.btn.soft:hover { background: rgba(211,162,79,.1); }
.btn.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
.btn.ghost:hover { color: var(--paper); border-color: var(--muted); }
.btn.ok { background: var(--teal); color: var(--ink); }
.btn.bad { background: #c05050; color: var(--paper); }
.btn.sm { padding: 7px 14px; font-size: 13px; }
.btn.block { width: 100%; }
.iconbtn { width: 36px; height: 36px; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; color: var(--muted); border-radius: 2px; transition: all .2s; }
.iconbtn:hover { color: var(--brass); border-color: var(--brass); }

/* ============ FORMS ============ */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > label, .lbl { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .3px; }
.inp { position: relative; display: flex; align-items: center; }
.inp > svg { position: absolute; inset-inline-start: 13px; color: var(--muted); pointer-events: none; }
.inp .input { padding-inline-start: 42px; }
.input, .select, .textarea { width: 100%; background: var(--ink-3); border: 1px solid var(--line); border-radius: 2px; padding: 11px 14px; color: var(--paper); transition: border-color .2s, box-shadow .2s; font-family: var(--font); font-size: 15px; }
.textarea { min-height: 90px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px rgba(211,162,79,.12); }
.filebox { display: flex; align-items: center; gap: 12px; border: 1px dashed var(--line); border-radius: 2px; padding: 14px; background: var(--ink-3); cursor: pointer; transition: border-color .2s; }
.filebox:hover { border-color: var(--brass); }
.filebox b { display: block; font-weight: 600; font-size: 15px; color: var(--paper); }
.filebox span { font-size: 13px; color: var(--muted); }
.filebox input { display: none; }
.ficon { width: 42px; height: 42px; border-radius: 2px; background: rgba(211,162,79,.1); color: var(--brass); display: grid; place-items: center; flex: none; border: 1px solid rgba(211,162,79,.2); }
.err { background: var(--bad-bg); color: var(--bad-fg); border-radius: 2px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; border-right: 3px solid var(--bad-fg); }
.note { background: var(--warn-bg); color: var(--warn-fg); border-radius: 2px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; display: flex; gap: 10px; border-right: 3px solid var(--brass); }
.note.good { background: var(--ok-bg); color: var(--ok-fg); border-right-color: var(--teal); }
.note.bad { background: var(--bad-bg); color: var(--bad-fg); border-right-color: var(--bad-fg); }

/* ============ BADGES ============ */
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 2px; padding: 4px 11px; font-size: 12px; font-weight: 600; letter-spacing: .3px; border: 1px solid; }
.badge.pending { background: var(--warn-bg); color: var(--warn-fg); border-color: rgba(211,162,79,.3); }
.badge.accepted { background: var(--ok-bg); color: var(--ok-fg); border-color: rgba(95,146,132,.3); }
.badge.rejected { background: var(--bad-bg); color: var(--bad-fg); border-color: rgba(200,80,80,.3); }
.badge.plain { background: transparent; color: var(--muted); border-color: var(--line); }
.pts { display: inline-flex; align-items: center; gap: 7px; background: transparent; color: var(--brass); border: 1px solid var(--brass); border-radius: 2px; padding: 4px 12px; font-weight: 700; font-family: var(--mono); font-size: 13px; letter-spacing: .5px; }
.card { background: var(--ink-2); border: 1px solid var(--line); border-radius: 2px; box-shadow: var(--shadow); }

/* ============ FIRE / STREAK ============ */
.fire {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--mono); font-weight: 700; font-size: 14px;
    padding: 3px 10px; border-radius: 2px;
    border: 1px solid;
    transition: all .3s;
    position: relative;
}
.fire.lvl-0 { color: var(--muted); border-color: var(--line); background: rgba(255,255,255,.02); }
.fire.lvl-1 { color: #f4a340; border-color: rgba(244,163,64,.4); background: rgba(244,163,64,.08); }
.fire.lvl-2 { color: #f4a340; border-color: #f4a340; background: rgba(244,163,64,.15); box-shadow: 0 0 12px -3px rgba(244,163,64,.5); }
.fire.lvl-3 { color: #e8642e; border-color: #e8642e; background: rgba(232,100,46,.18); box-shadow: 0 0 16px -3px rgba(232,100,46,.6); }
.fire.lvl-4 { color: #ff7a2e; border-color: #ff7a2e; background: rgba(255,122,46,.22); box-shadow: 0 0 20px -3px rgba(255,122,46,.7); animation: flicker 2s infinite; }
.fire.lvl-5 { color: #ff4a1a; border-color: #ff4a1a; background: rgba(255,74,26,.25); box-shadow: 0 0 24px -3px rgba(255,74,26,.8); animation: flicker 1.4s infinite; }
@keyframes flicker {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .85; transform: scale(1.05); }
}

/* ستريك البطاقة الكبيرة (رحلة الستريك) */
.streak-hero {
    background: linear-gradient(135deg, var(--ink-2) 0%, #2a1a0a 100%);
    border: 1px solid rgba(244,163,64,.3);
    border-top: 3px solid #f4a340;
    padding: 30px;
    border-radius: 2px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 26px;
    align-items: center;
    margin-bottom: 26px;
    position: relative;
    overflow: hidden;
}
.streak-hero::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 10% 20%, rgba(244,163,64,.1) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(232,100,46,.08) 0%, transparent 45%);
    pointer-events: none;
}
.streak-hero > * { position: relative; z-index: 1; }
.streak-flame-big {
    width: 90px; height: 90px;
    display: grid; place-items: center;
    font-size: 56px;
    filter: drop-shadow(0 0 20px rgba(244,163,64,.5));
    animation: flicker 1.6s infinite;
    border: 1px solid rgba(244,163,64,.3);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(244,163,64,.15) 0%, transparent 70%);
}
.streak-hero h2 { font-size: 28px; color: var(--paper); margin-bottom: 6px; }
.streak-hero p { color: var(--muted); font-size: 14.5px; }
.streak-hero .stat-big {
    text-align: center;
    background: rgba(244,163,64,.08);
    border: 1px solid rgba(244,163,64,.3);
    border-radius: 2px;
    padding: 14px 26px;
}
.streak-hero .stat-big b { font: 700 42px var(--display); display: block; line-height: 1; color: #f4a340; }
.streak-hero .stat-big small { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; letter-spacing: 2px; }
@media (max-width: 640px) { .streak-hero { grid-template-columns: 1fr; text-align: center; } .streak-flame-big { margin: 0 auto; } }

/* خريطة الستريك (مسار الشعلة) */
.streak-path {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
}
.streak-node {
    padding: 18px 14px;
    background: var(--ink-3);
    border: 1px solid var(--line);
    border-radius: 2px;
    text-align: center;
    transition: all .3s;
    position: relative;
}
.streak-node.reached {
    background: rgba(244,163,64,.06);
    border-color: rgba(244,163,64,.4);
}
.streak-node.reached::after {
    content: '';
    position: absolute;
    top: 6px; right: 6px;
    width: 8px; height: 8px;
    background: #f4a340;
    border-radius: 50%;
    box-shadow: 0 0 8px #f4a340;
}
.streak-node .ic { font-size: 32px; margin-bottom: 8px; filter: grayscale(.8); opacity: .5; }
.streak-node.reached .ic { filter: none; opacity: 1; }
.streak-node b { display: block; color: var(--paper); font-family: var(--display); font-size: 15px; margin-bottom: 3px; }
.streak-node small { color: var(--muted); font-size: 12px; font-family: var(--mono); }

/* ============ AUTH ============ */
.auth { min-height: 100vh; display: grid; grid-template-columns: minmax(360px, 520px) 1fr; }
.auth-form { padding: 36px clamp(20px, 5vw, 64px); display: flex; flex-direction: column; justify-content: center; max-width: 620px; width: 100%; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
.logo { width: 46px; height: 46px; border: 1px solid var(--brass); display: grid; place-items: center; color: var(--brass); border-radius: 2px; position: relative; }
.logo::before { content: ''; position: absolute; inset: 3px; border: 1px solid rgba(211,162,79,.3); border-radius: 1px; }
.brand b { font-family: var(--display); font-size: 24px; color: var(--paper); letter-spacing: .5px; }
.brand small { display: block; color: var(--muted); font-size: 12px; margin-top: -4px; letter-spacing: 1px; }
.auth h1 { font-size: 30px; margin-bottom: 6px; color: var(--paper); }
.auth .lead { color: var(--muted); margin-bottom: 22px; font-size: 15px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--ink-3); padding: 4px; border-radius: 2px; gap: 2px; margin-bottom: 18px; border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; border-radius: 2px; padding: 10px; font-weight: 600; color: var(--muted); transition: all .2s; font-size: 14px; }
.seg button.on { background: var(--brass); color: var(--ink); }
.demo { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); }
.demo p { font-size: 13.5px; color: var(--muted); margin-bottom: 10px; }
.demo .row { display: flex; gap: 10px; flex-wrap: wrap; }
.auth-art { position: relative; overflow: hidden; background: var(--ink-2); border-inline-start: 1px solid var(--line); color: var(--paper); display: flex; align-items: center; justify-content: center; padding: 40px; }
.auth-art::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle at 20% 30%, rgba(211,162,79,.1) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(95,146,132,.08) 0%, transparent 40%); pointer-events: none; }
.auth-art .inner { width: min(440px, 100%); position: relative; z-index: 1; }
.auth-art h2 { font-size: 32px; margin-bottom: 10px; line-height: 1.4; color: var(--paper); }
.auth-art p { color: var(--muted); max-width: 34ch; margin-bottom: 20px; font-size: 15px; }
@media (max-width: 900px) { .auth { grid-template-columns: 1fr; } .auth-art { display: none; } }

/* ============ JOURNEY MAP ============ */
.jm { width: 100%; height: auto; display: block; overflow: visible; }
.jm-track { fill: none; stroke: var(--line); stroke-width: 2; stroke-linecap: round; stroke-dasharray: .012 .02; }
.jm-fill { fill: none; stroke-width: 2; stroke-linecap: round; }
.jm.dark .jm-track { stroke: rgba(211,162,79,.2); }
.jm.anim .jm-fill { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw 2.6s .2s cubic-bezier(.6,.1,.3,1) forwards; }
.jm-dot { fill: var(--ink-3); stroke: var(--line); stroke-width: 2; }
.jm.dark .jm-dot { fill: var(--ink-3); stroke: rgba(211,162,79,.3); }
.done .jm-dot { fill: var(--brass); stroke: none; }
.now .jm-dot { fill: var(--teal); stroke: none; }
.jm-num { font: 600 15px var(--mono); text-anchor: middle; dominant-baseline: central; fill: var(--muted); }
.done .jm-num { fill: var(--ink) !important; }
.now .jm-num { fill: var(--ink) !important; }
.jm-label { font: 600 14px var(--display); fill: var(--paper); }
.jm-sub { font: 400 12px var(--font); fill: var(--muted); }
.todo .jm-label, .todo .jm-sub { opacity: .5; }
.jm-ring { fill: none; stroke: var(--teal); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
.jm.anim .jm-node { opacity: 0; animation: pop .5s calc(var(--i) * .32s + .35s) ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes pulse { 0% { transform: scale(.85); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }

/* ============ SHELL ============ */
.app { display: grid; grid-template-columns: 268px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 22px 16px; background: var(--ink-2); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.side .brand { margin: 0 8px 22px; }
.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow: auto; padding-top: 8px; border-top: 1px solid var(--line); }
.nav button { display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 11px 14px; border-radius: 2px; font-weight: 500; color: var(--muted); text-align: start; transition: all .2s; font-size: 14px; position: relative; }
.nav button::before { content: ''; position: absolute; inset-inline-start: 0; top: 50%; transform: translateY(-50%); width: 2px; height: 0; background: var(--brass); transition: height .25s; }
.nav button:hover { color: var(--paper); background: rgba(211,162,79,.04); }
.nav button.on { color: var(--brass); background: rgba(211,162,79,.06); font-weight: 600; }
.nav button.on::before { height: 60%; }
.nav .count { margin-inline-start: auto; background: var(--brass); color: var(--ink); border-radius: 2px; font-size: 11px; padding: 1px 7px; font-weight: 700; font-family: var(--mono); }
.nav .count.fire-count { background: linear-gradient(135deg, #f4a340, #e8642e); color: #fff; }

.me { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 2px; background: var(--ink-3); border: 1px solid var(--line); }
.av { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--brass); color: var(--brass); display: grid; place-items: center; font-weight: 700; font-family: var(--display); flex: none; font-size: 15px; }
.me b { display: block; font-size: 14px; line-height: 1.3; color: var(--paper); }
.me small { color: var(--muted); font-size: 12px; letter-spacing: .5px; }
.me .tools { margin-inline-start: auto; display: flex; gap: 4px; }
.me .iconbtn { width: 30px; height: 30px; border-radius: 2px; }
.main { padding: 32px clamp(16px, 3.4vw, 48px) 60px; min-width: 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.head h1 { font-size: 32px; color: var(--paper); }
.head p { color: var(--muted); margin-top: 4px; font-size: 14px; }

@media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; inset: auto 0 0 0; top: auto; height: auto; flex-direction: row; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 30; border-top: 1px solid var(--line); border-inline-end: 0; }
    .side .brand, .side .me { display: none; }
    .side .nav { flex-direction: row; overflow-x: auto; justify-content: flex-start; gap: 2px; border-top: 0; padding-top: 0; }
    .side .nav button { flex-direction: column; gap: 3px; font-size: 11px; padding: 7px 10px; min-width: 64px; align-items: center; text-align: center; position: relative; }
    .side .nav button::before { display: none; }
    .side .nav button.on { background: rgba(211,162,79,.1); }
    .side .nav .count { position: absolute; top: 2px; inset-inline-end: 8px; font-size: 10px; padding: 0 5px; }
    .main { padding-bottom: 110px; padding-top: 16px; }
    .mobile-bar { display: flex !important; }
}
.mobile-bar { display: none; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }

/* ============ STATS ============ */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 26px; }
.stat { padding: 20px; display: flex; align-items: center; gap: 14px; border-top: 2px solid var(--c, var(--brass)); transition: all .25s; }
.stat:hover { transform: translateY(-3px); border-color: var(--brass); }
.stat .si { width: 46px; height: 46px; border-radius: 2px; display: grid; place-items: center; background: rgba(211,162,79,.08); color: var(--c, var(--brass)); border: 1px solid rgba(211,162,79,.15); }
.stat b { font: 700 26px var(--display); display: block; line-height: 1.1; color: var(--paper); }
.stat span { color: var(--muted); font-size: 13px; letter-spacing: .3px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
.panel { padding: 22px; }
.panel h3 { font-size: 19px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); color: var(--paper); }

/* ============ HERO ============ */
.hero { padding: 32px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; background: var(--ink-2); border: 1px solid var(--line); border-top: 3px solid var(--brass); margin-bottom: 28px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle at 15% 20%, rgba(211,162,79,.08) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(95,146,132,.06) 0%, transparent 40%); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero h1 { font-size: 30px; margin-bottom: 6px; color: var(--paper); }
.hero p { color: var(--muted); font-size: 14px; }
.hero .bar { margin-top: 18px; height: 4px; border-radius: 0; background: var(--ink-3); overflow: hidden; max-width: 420px; border: 1px solid var(--line); }
.hero .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brass), var(--teal)); transition: width .5s ease; }
.hero small { display: block; margin-top: 10px; color: var(--muted); font-size: 13px; }
.hero .big { text-align: center; background: var(--ink-3); border: 1px solid var(--line); border-radius: 2px; padding: 18px 30px; }
.hero .big b { font: 700 44px var(--display); display: block; line-height: 1; color: var(--brass); }
.hero .big::after { content: 'نقطة'; display: block; margin-top: 6px; color: var(--muted); font-size: 13px; letter-spacing: 2px; }
@media (max-width: 640px) { .hero { grid-template-columns: 1fr; } }

/* ============ UNITS ============ */
.units { display: flex; flex-direction: column; gap: 16px; }
.unit { background: var(--ink-2); border: 1px solid var(--line); border-right: 3px solid var(--u, var(--brass)); border-radius: 2px; overflow: hidden; transition: all .25s; }
.unit:hover { border-color: var(--u, var(--brass)); }
.unit-head { display: flex; gap: 14px; align-items: center; width: 100%; text-align: start; padding: 18px 22px; background: none; border: 0; transition: background .2s; }
.unit-head:hover { background: rgba(211,162,79,.03); }
.unit-num { width: 46px; height: 46px; border: 1px solid var(--u, var(--brass)); color: var(--u, var(--brass)); font: 700 20px var(--mono); display: grid; place-items: center; flex: none; border-radius: 2px; background: rgba(211,162,79,.04); }
.unit-head h3 { font-size: 19px; color: var(--paper); }
.unit-head p { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.unit-head .chev { margin-inline-start: auto; color: var(--muted); transition: transform .25s; flex: none; }
.unit.open .chev { transform: rotate(180deg); }

.hw .top b { color: var(--paper); font-size: 15px; }

.empty { text-align: center; color: var(--muted); padding: 30px 16px; font-size: 14px; border: 1px dashed var(--line); border-radius: 2px; background: var(--ink); }

.list { display: flex; flex-direction: column; gap: 10px; }

/* ---------- Streak (الشعلة) ---------- */
/* Streak = عدد الواجبات المقبولة (كل واجب مقبول = +1)، وتزيد بشكل متتالي */
const streakOf = (db, studentId) => {
  return db.submissions.filter(s => s.studentId === studentId && s.status === 'accepted').length;
};
/* أعلى سلسلة وصلت لها الطالبة = streak حالياً (لأن الستريك يتراكم) */
const bestStreak = (db, studentId) => {
  /* أطول سلسلة: نحسب عدد الواجبات المقبولة بترتيب زمني متتالية */
  const accepted = db.submissions
    .filter(s => s.studentId === studentId && s.status === 'accepted')
    .sort((a,b) => a.createdAt - b.createdAt);
  if (accepted.length === 0) return 0;
  let best = 1, cur = 1;
  for (let i = 1; i < accepted.length; i++) {
    const diff = (accepted[i].createdAt - accepted[i-1].createdAt) / 864e5;
    if (diff <= 2) { cur++; best = Math.max(best, cur); }
    else cur = 1;
  }
  return best;
};
/* Current streak = عدد الأيام/الواجبات المتتالية الحالية (آخر واجب مقبول خلال آخر 3 أيام) */
const currentStreak = (db, studentId) => {
  const acc = db.submissions
    .filter(s => s.studentId === studentId && s.status === 'accepted')
    .sort((a,b) => b.createdAt - a.createdAt);
  if (acc.length === 0) return 0;
  const now = Date.now();
  if ((now - acc[0].createdAt) > 3 * 864e5) return 0;
  let streak = 1;
  for (let i = 1; i < acc.length; i++) {
    const diff = (acc[i-1].createdAt - acc[i].createdAt) / 864e5;
    if (diff <= 2) streak++;
    else break;
  }
  return streak;
};
/* streak للمجموعة = متوسط/مجموع streaks أعضائها */
const groupStreak = (db, groupId) => {
  const members = db.users.filter(u => u.role==='student' && u.status==='approved' && (u.groupIds||[]).includes(groupId));
  if (members.length === 0) return { total: 0, avg: 0, count: 0 };
  const total = members.reduce((sum,u) => sum + currentStreak(db, u.id), 0);
  return { total, avg: Math.round(total / members.length * 10) / 10, count: members.length };
};

function readFile(file){
  return new Promise((res,rej)=>{
    if(!file) return rej(new Error('none'));
    if(file.size>MAX_MB*1024*1024) return rej(new Error('big'));
    const r=new FileReader(); r.onload=()=>res({fileName:file.name,dataUrl:r.result}); r.onerror=()=>rej(new Error('read')); r.readAsDataURL(file);
  });
}
function blobUrl(d){
  try{ const [h,b]=d.split(','); const m=(h.match(/:(.*?)[;,]/)||[])[1]||'application/octet-stream';
    if(h.indexOf('base64')<0) return d;
    const bin=atob(b), a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([a],{type:m})); }catch(e){ return d; }
}

function JourneyMap({nodes,current=-1,animate=false,onDark=false,gid='jmg'}){
  const step=104,top=46,H=top*2+(nodes.length-1)*step-30;
  const pts=nodes.map((n,i)=>({x:i%2===0?250:70,y:top+i*step}));
  let d='M'+pts[0].x+' '+pts[0].y;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];d+=' C'+a.x+' '+(a.y+step*.55)+','+b.x+' '+(b.y-step*.55)+','+b.x+' '+b.y;}
  const frac=Math.max(0,Math.min(1,current/(nodes.length-1)));
  const fillStyle=animate?{}:{strokeDasharray:frac+' 1'};
  return html`<svg className=${cx('jm',onDark&&'dark',animate&&'anim')} viewBox=${'0 0 320 '+H} role="img" aria-label="خريطة الرحلة">
    <defs><linearGradient id=${gid} gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2=${H}><stop offset="0" stop-color="#d3a24f"/><stop offset="1" stop-color="#5f9284"/></linearGradient></defs>
    <path d=${d} className="jm-track" pathLength="1"/>
    <path d=${d} className="jm-fill" pathLength="1" stroke=${'url(#'+gid+')'} style=${fillStyle}/>
    ${nodes.map((n,i)=>{
      const p=pts[i], st=animate?'done':(i<current?'done':i===current?'now':'todo'), left=p.x<160;
      return html`<g key=${i} className=${'jm-node '+st} style=${{'--i':i,'--c':n.color||'#d3a24f'}}>
        ${st==='now'&&html`<circle className="jm-ring" cx=${p.x} cy=${p.y} r="28"/>`}
        <circle className="jm-dot" cx=${p.x} cy=${p.y} r="20"/>
        <text className="jm-num" x=${p.x} y=${p.y}>${n.num!=null?n.num:(i<current?'✓':i+1)}</text>
        <text className="jm-label" x=${left?p.x+34:p.x-34} y=${p.y-3} textAnchor=${left?'start':'end'}>${n.label}</text>
        <text className="jm-sub" x=${left?p.x+34:p.x-34} y=${p.y+15} textAnchor=${left?'start':'end'}>${n.sub||''}</text>
      </g>`;})}
  </svg>`;
}

    <${Head} title="تصحيح الواجبات" sub="اقبلي أو ارفضي، واكتبي تعليقًا يصل إلى الطالبة."/>
    <div className="tabs">${[['pending','بانتظار التصحيح ('+c('pending')+')'],['accepted','المقبولة ('+c('accepted')+')'],['rejected','المردودة ('+c('rejected')+')'],['all','الكل ('+all.length+')']].map(x=>html`<button key=${x[0]} className=${cx('tab',f===x[0]&&'on')} onClick=${()=>setF(x[0])}>${x[1]}</button>`)}</div>
    <div className="list">${list.length===0&&html`<${Empty} title="لا شيء هنا" text="لا توجد تسليمات بهذه الحالة."/>`}${list.map(s=>html`<${GradeCard} key=${s.id+s.status} s=${s}/>`)}</div>
  </div>`;
}

/* ---------- Teacher: learning journey ---------- */
function TJourney(){
  const {db,deletePoint,toast}=useApp();
  const [pm,setPm]=useState(false);
  const students=db.users.filter(u=>u.role==='student'&&u.status==='approved').map(u=>({u,p:pointsOf(db,u.id),streak:currentStreak(db,u.id)})).sort((a,b)=>b.p-a.p);
  const max=Math.max(1,...students.map(x=>x.p));
  const log=[...db.points].sort((a,b)=>b.at-a.at).slice(0,12);
  return html`<div>
    <${Head} title="رحلة التعلّم" sub="امنحي النقاط وتابعي تقدّم كل طالبة. تظهر النقاط في صفحتها فورًا."><button className="btn" onClick=${()=>setPm(true)}><${Icon} n="star" s=${15} fill=${true}/> منح نقاط</button><//>
    <div className="cols">
      <div className="card panel"><h3>ترتيب الطالبات بالنقاط</h3>
        ${students.length===0?html`<${Empty} title="لا طالبات بعد" text="اقبلي طلبات التسجيل أولًا."/>`:students.map((x,i)=>html`<div key=${x.u.id} className="lb"><span className="rk">${i+1}</span><div style=${{flex:1}}><div style=${{display:'flex',justifyContent:'space-between',gap:8,alignItems:'center'}}><b style=${{fontWeight:600,color:'var(--paper)'}}>${x.u.name}</b><span style=${{display:'flex',gap:6,alignItems:'center'}}><${FireBadge} n=${x.streak}/><span style=${{color:'var(--muted)',fontSize:13}}>${LEVELS[levelIdx(x.p)].name}</span></span></div><div className="bar"><i style=${{width:Math.round(x.p/max*100)+'%'}}></i></div></div><span className="pts">${x.p}</span></div>`)}</div>
      <div className="card panel"><h3>آخر حركات النقاط</h3>
        ${log.length===0?html`<${Empty} title="لا حركات بعد" text="امنحي أول نقاط لتظهر هنا."/>`:html`<div className="log">${log.map(p=>{const s=db.users.find(u=>u.id===p.studentId);return html`<div key=${p.id} className="l"><span className=${'amt '+(p.amount>=0?'plus':'minus')}>${p.amount>0?'+':''}${p.amount}</span><div style=${{flex:1,minWidth:0}}><b style=${{fontWeight:500,color:'var(--paper)'}}>${s?s.name:''}</b><div style=${{fontSize:12.5,color:'var(--muted)'}}>${p.reason} • ${fmtDate(p.at)}</div></div><button className="iconbtn" aria-label="حذف الحركة" onClick=${()=>{deletePoint(p.id);toast('تم حذف الحركة');}}><${Icon} n="trash" s=${14}/></button></div>`;})}</div>`}</div>
    </div>
    ${pm&&html`<${PointsModal} onClose=${()=>setPm(false)}/>`}
  </div>`;
}

/* ---------- Viewer ---------- */
function Viewer({item,onClose}){
  const src=useMemo(()=>item.dataUrl?(item.kind==='image'?item.dataUrl:blobUrl(item.dataUrl)):'',[item]);
  return html`<${Modal} title=${item.title} onClose=${onClose} wide=${true}><div className="viewer">
    ${item.kind==='image'?html`<img src=${src} alt=${item.title}/>`:html`<iframe src=${src} title=${item.title}></iframe>`}
    <p style=${{color:'var(--muted)',fontSize:13,marginTop:10}}>إن لم يظهر الملف في هذه النافذة فقد يمنع المتصفح عرضه هنا.</p></div><//>`;
}

/* ---------- App ---------- */
function App(){
  const [db,setDb]=useState(()=>{const s=store.get(KEY);return s&&s.v===2?s:seed();});
  const [sid,setSid]=useState(()=>store.get(SKEY));
  const [page,setPage]=useState('home');
  const [toasts,setToasts]=useState([]);
  const [viewer,setViewer]=useState(null);
  const [theme,setTheme]=useState(()=>store.get(TKEY)||'auto');
  const warned=React.useRef(false);
  useEffect(()=>{ if(!store.set(KEY,db)&&!warned.current){warned.current=true;toast('تعذّر حفظ البيانات في المتصفح، قد تكون الملفات كبيرة','bad');} },[db]);
  useEffect(()=>{ if(theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',theme); },[theme]);
  const toast=(m,kind)=>{const id=uid();setToasts(t=>[...t,{id,m,kind}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3200);};
  const me=db.users.find(u=>u.id===sid&&u.status==='approved')||null;
  const upd=fn=>setDb(d=>fn(d));
  const A={
    db,me,toast,openViewer:setViewer,theme,
    toggleTheme:()=>{const dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);const n=dark?'light':'dark';setTheme(n);store.set(TKEY,n);},
    login:(role,email,password)=>{
      const u=db.users.find(x=>x.email.toLowerCase()===email.trim().toLowerCase()&&x.password===password);
      if(!u||u.role!==role) return {error:role==='teacher'?'بيانات المعلمة غير صحيحة.':'البريد الإلكتروني أو كلمة المرور غير صحيحة.'};
      if(u.status!=='approved') return {status:u.status};
      store.set(SKEY,u.id); setSid(u.id); setPage(u.role==='teacher'?'dash':'home'); return {ok:true};
    },
    logout:()=>{store.del(SKEY);setSid(null);},
    register:f=>{
      if(db.users.some(u=>u.email.toLowerCase()===f.email.trim().toLowerCase())) return {error:'هذا البريد مسجّل من قبل. جرّبي تسجيل الدخول.'};
      upd(d=>({...d,users:[...d.users,{id:uid(),role:'student',name:f.name.trim(),email:f.email.trim(),password:f.password,status:'pending',sectionId:null,groupIds:[],createdAt:Date.now()}]}));
      return {ok:true};
    },
    approve:(id,sec)=>upd(d=>({...d,users:d.users.map(u=>u.id===id?{...u,status:'approved',sectionId:sec}:u)})),
    reject:id=>upd(d=>({...d,users:d.users.map(u=>u.id===id?{...u,status:'rejected'}:u)})),
    setSection:(id,sec)=>upd(d=>({...d,users:d.users.map(u=>u.id===id?{...u,sectionId:sec}:u)})),
    removeStudent:id=>upd(d=>({...d,users:d.users.filter(u=>u.id!==id),submissions:d.submissions.filter(s=>s.studentId!==id),points:d.points.filter(p=>p.studentId!==id)})),
    addSection:name=>upd(d=>({...d,sections:[...d.sections,{id:'c'+uid(),name}]})),
    renameSection:(id,name)=>upd(d=>({...d,sections:d.sections.map(s=>s.id===id?{...s,name}:s)})),
    deleteSection:id=>upd(d=>({...d,sections:d.sections.filter(s=>s.id!==id),users:d.users.map(u=>u.sectionId===id?{...u,sectionId:null}:u)})),
    /* مجموعات */
    addGroup:g=>upd(d=>({...d,groups:[...d.groups,{...g,id:'g'+uid(),createdAt:Date.now()}]})),
    updateGroup:(id,patch)=>upd(d=>({...d,groups:d.groups.map(g=>g.id===id?{...g,...patch}:g)})),
    deleteGroup:id=>upd(d=>({...d,groups:d.groups.filter(g=>g.id!==id),users:d.users.map(u=>u.groupIds&&u.groupIds.includes(id)?{...u,groupIds:u.groupIds.filter(x=>x!==id)}:u)})),
    toggleGroupMember:(uidS,gid)=>upd(d=>({...d,users:d.users.map(u=>{
      if(u.id!==uidS) return u;
      const has=(u.groupIds||[]).includes(gid);
      return {...u, groupIds: has ? (u.groupIds||[]).filter(x=>x!==gid) : [...(u.groupIds||[]),gid]};
    })})),
    saveUnit:(id,patch)=>upd(d=>({...d,units:d.units.map(u=>u.id===id?{...u,...patch}:u)})),
    addItem:it=>upd(d=>({...d,items:[...d.items,{...it,id:uid()}]})),
    deleteItem:id=>upd(d=>({...d,items:d.items.filter(i=>i.id!==id)})),
    submit:x=>upd(d=>{
      if(x.replace) return {...d,submissions:d.submissions.map(s=>s.id===x.replace?{...s,note:x.note,fileName:x.fileName,dataUrl:x.dataUrl,status:'pending',createdAt:Date.now(),reviewedAt:null}:s)};
      const ex=x.itemId!=='u7'&&d.submissions.find(s=>s.studentId===x.studentId&&s.itemId===x.itemId);
      if(ex) return d;
      return {...d,submissions:[...d.submissions,{id:uid(),studentId:x.studentId,itemId:x.itemId,unitId:x.unitId,note:x.note,fileName:x.fileName,dataUrl:x.dataUrl,status:'pending',comment:'',points:0,createdAt:Date.now()}]};
    }),
    review:(id,r)=>upd(d=>{
      const s0=d.submissions.find(s=>s.id===id);
      const subs=d.submissions.map(s=>s.id===id?{...s,status:r.status,comment:r.comment,points:r.status==='accepted'?r.points:0,reviewedAt:Date.now()}:s);
      let pts=d.points.filter(p=>p.subId!==id);
      if(r.status==='accepted'&&r.points>0) pts=[{id:uid(),studentId:s0.studentId,amount:r.points,reason:'تصحيح: '+itemTitle(d,s0),at:Date.now(),subId:id},...pts];
      return {...d,submissions:subs,points:pts};
    }),
    givePoints:p=>upd(d=>({...d,points:[{id:uid(),studentId:p.studentId,amount:p.amount,reason:p.reason,at:Date.now()},...d.points]})),
    deletePoint:id=>upd(d=>({...d,points:d.points.filter(p=>p.id!==id)})),
    resetDemo:()=>{setDb(seed());}
  };
  const pendReq=db.users.filter(u=>u.role==='student'&&u.status==='pending').length;
  const pendSub=db.submissions.filter(s=>s.status==='pending').length;
  const tNav=[
    {id:'dash',label:'نظرة عامة',icon:'grid'},
    {id:'requests',label:'الطلبات',icon:'inbox',count:pendReq},
    {id:'students',label:'الطالبات',icon:'users'},
    {id:'classes',label:'الفصول',icon:'layers'},
    {id:'groups',label:'المجموعات',icon:'flag'},
    {id:'content',label:'المحتوى',icon:'book'},
    {id:'grading',label:'التصحيح',icon:'edit',count:pendSub},
    {id:'journey',label:'رحلة التعلّم',icon:'award'}
  ];
  const sNav=[
    {id:'home',label:'الوحدات',icon:'home'},
    {id:'work',label:'تسليماتي',icon:'edit'},
    {id:'groups',label:'المجموعات',icon:'flag'},
    {id:'journey',label:'رحلتي',icon:'map'}
  ];
  let body;
  if(!me) body=html`<${Auth}/>`;
  else if(me.role==='teacher'){
    const pages={
      dash:html`<${TDash} go=${setPage}/>`,
      requests:html`<${TRequests}/>`,
      students:html`<${TStudents}/>`,
      classes:html`<${TClasses}/>`,
      groups:html`<${TGroups}/>`,
      content:html`<${TContent}/>`,
      grading:html`<${TGrading}/>`,
      journey:html`<${TJourney}/>`
    };
    body=html`<${Shell} nav=${tNav} page=${page} setPage=${setPage}>${pages[page]||pages.dash}
      <div style=${{marginTop:40,paddingTop:20,borderTop:'1px solid var(--line)'}}><button className="btn ghost sm" onClick=${()=>{if(confirm('سيتم مسح كل التعديلات وإعادة البيانات التجريبية. متابعة؟')){A.resetDemo();toast('أُعيدت البيانات التجريبية');}}}>إعادة ضبط البيانات التجريبية</button></div><//>`;
  } else {
    const pages={
      home:html`<${StudentHome}/>`,
      work:html`<${StudentWork}/>`,
      groups:html`<${StudentGroups}/>`,
      journey:html`<${StudentJourney}/>`
    };
    body=html`<${Shell} nav=${sNav} page=${page} setPage=${setPage}>${pages[page]||pages.home}<//>`;
  }
  return html`<${Ctx.Provider} value=${A}>${body}
    ${viewer&&html`<${Viewer} item=${viewer} onClose=${()=>setViewer(null)}/>`}
    <div className="toasts" aria-live="polite">${toasts.map(t=>html`<div key=${t.id} className=${cx('toast',t.kind)}>${t.m}</div>`)}</div>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
